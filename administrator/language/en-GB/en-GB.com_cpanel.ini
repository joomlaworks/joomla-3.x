COM_CPANEL_MESSAGES_BODY_NOCLOSE="Each release of Joomla 3.x UTD comes with a short summary of what it brings: new features, improvements and fixes."
COM_CPANEL_MESSAGES_BODYMORE_NOCLOSE="Hide the messages once you've read them, and this box goes away until the next release."
COM_CPANEL_MESSAGES_REVIEW="Read Messages"
COM_CPANEL_MESSAGES_TITLE="You have post-installation messages – see what's new in this release!"
; Translators: Don't touch the code part in the following message, Starting with ## Mod rewrite ...
COM_CPANEL_MSG_ADDNOSNIFF_BODY="<p>Joomla is now shipped with additional security hardenings in the default htaccess.txt and web.config.txt files. These hardenings disable the so called MIME-type sniffing feature in web browsers. The sniffing leads to specific attack vectors, where scripts in normally harmless file formats (eg images) will be executed, leading to Cross-Site-Scripting vulnerabilities.</p><p>The security team recommends to manually apply the necessary changes to existing .htaccess or web.config files, as those files can not be updated automatically.</p><p><strong>Changes for .htaccess</strong><br />Add the following lines before \"## Mod_rewrite in use.\":</p><pre>&lt;IfModule mod_headers.c&gt;\nHeader always set X-Content-Type-Options \"nosniff\"\n&lt;/IfModule&gt;</pre><p><strong>Changes for web.config</strong><br />Add the following lines right after \"&lt;/rewrite&gt;\":</p><pre>&lt;httpProtocol&gt;\n  &lt;customHeaders&gt;\n    &lt;add name=\"X-Content-Type-Options\" value=\"nosniff\" /&gt;\n  &lt;/customHeaders&gt;\n&lt;/httpProtocol&gt;</pre>"
COM_CPANEL_MSG_ADDNOSNIFF_TITLE=".htaccess & web.config Security Update"
COM_CPANEL_MSG_EACCELERATOR_BODY="eAccelerator is not compatible with Joomla! By selecting the Change to File Caching button below we will change the cache handler to file. If you want to use a different cache handler, please change it in the Global Configuration page."
COM_CPANEL_MSG_EACCELERATOR_BUTTON="Change to File."
COM_CPANEL_MSG_EACCELERATOR_TITLE="eAccelerator is not compatible with Joomla!"
COM_CPANEL_MSG_HTACCESS_BODY="A change to the default .htaccess and web.config files was made in Joomla! 3.4 to disallow folder listings by default.  Users are recommended to implement this change in their files.  Please see <a href=\"https://docs.joomla.org/Special:MyLanguage/Preconfigured_htaccess\">this page</a> for more information."
COM_CPANEL_MSG_HTACCESS_TITLE=".htaccess & web.config Update"
COM_CPANEL_MSG_HTACCESSSVG_TITLE="Additional XSS protection for the usage of SVG files"
COM_CPANEL_MSG_HTACCESSSVG_BODY="<p>Since 3.9.21 Joomla is shipped with an additional security rule in the default htaccess.txt. This rule will protect users of svg files from potential Cross-Site-Scripting (XSS) vulnerabilities.<br>The security team recommends to manually apply the necessary changes to any existing .htaccess file, as this file can not be updated automatically.</p><p><strong>Changes for .htaccess</strong></p><pre>&lt;FilesMatch \"\.svg$\"&gt;\n  &lt;IfModule mod_headers.c&gt;\n    Header always set Content-Security-Policy \"script-src 'none'\"\n  &lt;/IfModule&gt;\n&lt;/FilesMatch&gt;</pre><p>Currently we are not aware of a method to conditionally configure this on IIS web servers, please contact your hosting provider for further assistance.</p>"
COM_CPANEL_MSG_JOOMLA40_PRE_CHECKS_TITLE="Prepare for the next Major Release of Joomla"
COM_CPANEL_MSG_JOOMLA40_PRE_CHECKS_BODY="<p>Beginning with Joomla! 4.0 we are raising the minimum server requirements. If you are seeing this message then your current configuration does not meet these new minimum requirements.</p><p>The <a href=\"https://developer.joomla.org/news/788-joomla-4-on-the-move.html\"><strong>minimum</strong> requirements</a> are the following:</p><ul><li>PHP 7.2.5</li><li>MySQL 5.6</li><li>MariaDB 10.1</li><li>PostgreSQL 11.0</li><li>MS SQL will <strong>not</strong> be supported</li><li>MySQL using the legacy `ext/mysql` PHP extension will <strong>not</strong> be supported, either the MySQLi or \"MySQL (PDO)\" driver must be used instead</li><li>PostgreSQL using the `ext/pgsql` PHP extension will <strong>not</strong> be supported, the \"PostgreSQL (PDO)\" driver must be used instead</li></ul><p>Please contact your hosting provider to ask how you can meet these raised server requirements - it is usually a very simple change. When you meet these new requirements then this message will no longer be displayed.</p>"
COM_CPANEL_MSG_LANGUAGEACCESS340_TITLE="You have possible issues with your multilingual settings"
COM_CPANEL_MSG_LANGUAGEACCESS340_BODY="Since Joomla! 3.4.0 you may have issues with the System - Language Filter plugin on your website. To fix them please open the <a href=\"index.php?option=com_languages&view=languages\">Language Manager</a> and save each content language manually to make sure an Access level is saved."
; The following two strings are deprecated and will be removed with 4.0
COM_CPANEL_MSG_PHPVERSION_BODY="Beginning with Joomla! 3.3, the version of PHP this site is using will no longer be supported. Joomla! 3.3 will require at least <a href=\"https://community.joomla.org/blogs/leadership/1798-raising-the-bar-on-security.html\">PHP version 5.3.10 to provide enhanced security features to its users</a>."
COM_CPANEL_MSG_PHPVERSION_TITLE="Your PHP Version Will Be Unsupported in Joomla! 3.3"
COM_CPANEL_MSG_ROBOTS_TITLE="robots.txt Update"
COM_CPANEL_MSG_ROBOTS_BODY="A change to the default robots.txt files was made in Joomla! 3.3 to allow Google to access templates and media files by default to improve SEO. This change is not applied automatically on upgrades and users are recommended to review the changes in the robots.txt.dist file and implement these changes in their own robots.txt file."
COM_CPANEL_MSG_STATS_COLLECTION_BODY="<p>Since Joomla! 3.5 a statistics plugin will submit anonymous data to the Joomla Project. This will only submit the Joomla version, PHP version, database engine and version, and server operating system.</p><p>This data is collected to ensure that future versions of Joomla can take advantage of the latest database and PHP features without affecting significant numbers of users. The need for this became clear when a minimum of PHP 5.3.10 was required when Joomla! 3.3 implemented the more secure Bcrypt passwords.</p><p>In the interest of full transparency and to help developers <a href=\"https://developer.joomla.org/about/stats.html\">this data is publicly available.</a> An API and graphs will show the Joomla version, PHP versions and database engines in use.</p><p>If you do not wish to provide the Joomla Project with this information you can disable the plugin called System - Joomla Statistics.</p>"
COM_CPANEL_MSG_STATS_COLLECTION_TITLE="Stats Collection in Joomla"
COM_CPANEL_MSG_TEXTFILTER3919_BODY="<p>As part of our security team's review, we have made some changes to the default settings for the global text filters in a new Joomla installation. The default setting for the 'Public', 'Guest' and 'Registered' groups is now 'No HTML'. As these changes are only applied to new installations, we strongly recommend that you review these changes and update your site from: System -> Global Configuration -> Text Filters</p>"
COM_CPANEL_MSG_TEXTFILTER3919_TITLE="Updated Text Filter Recommendations"
COM_CPANEL_MSG_UPDATEDEFAULTSETTINGS_BODY="<p>As part of our security team's review, we have made some changes to the default settings in a new Joomla installation. As these changes are only applied to new installations, we strongly recommend that you review these changes and update your site.</p><p>The changed settings are:</p><ul><li>Global Configuration > Text Filters: The default \"Administrator\" user group has changed from \"No Filtering\" to \"Default Blacklist\"</li><li>Users > Send Password: The option to send a user their password in plain text when an account is created is now disabled by default</li><li>Media Manager: Flash files (\"swf\" file extension and \"application/x-shockwave-flash\" MIME Type) are not allowed to be uploaded</li><li>Articles > Show Email: The option to show an email icon with articles is disabled by default</li></ul><p>We have created a <a href=\"https://docs.joomla.org/Special:MyLanguage/J3.x:Joomla_3.8.8_notes_about_the_changed_default_settings\">dedicated documentation page</a> explaining these changes.</p>"
COM_CPANEL_MSG_UPDATEDEFAULTSETTINGS_TITLE="Updated site security recommendations"
COM_CPANEL_MSG_UTD_3_11_BODY="<p>Released on April 20th, 2026: the first release of Joomla 3.x UTD, based on Joomla 3.10.20 eLTS.</p><ul><li>Runs on current PHP versions, up to PHP 8.5.</li><li>Security fixes for three vulnerabilities reported after Joomla 3.10.20 eLTS was released.</li><li>More hardening: timing-safe checks of two-factor authentication codes and password reset tokens, the last steps of Joomla Update restricted to Super Users, more executable file types refused in uploads, a working check for HTML in uploaded files, and no more <code>eval()</code> when templates count modules.</li><li>YubiKey two-factor authentication signs its requests to Yubico's servers and verifies their answers.</li><li>Works better with MySQL 8.x.</li></ul><p>See the <a href=\"https://github.com/joomlaworks/joomla-3.x/blob/main/CHANGELOG.md\" target=\"_blank\" rel=\"noopener noreferrer\">changelog</a> for the full list of changes.</p>"
COM_CPANEL_MSG_UTD_3_11_TITLE="What's New in Joomla 3.x UTD 3.11"
COM_CPANEL_MSG_UTD_3_12_BODY="<p>Released on May 21st, 2026.</p><ul><li>Updates through <strong>Joomla Update</strong>: this distribution has its own update server, so new releases are offered in System: Joomla Update.</li><li>Security fixes backported from Joomla 4, 5 and 6: <code>data:</code> URIs in the HTML filter, module style attributes, database identifiers, and the Multilingual Associations editor.</li><li>Removed the Beez3 and Hathor templates and the &quot;End of Support&quot; and PHP version check Quick Icon plugins. Sites using Beez3 or Hathor as their default template switch to Protostar or Isis.</li><li><code>{loadmoduleid}</code> shows the module with the given ID.</li><li>More PHP 8.x compatibility fixes.</li></ul><p>See the <a href=\"https://github.com/joomlaworks/joomla-3.x/blob/main/CHANGELOG.md\" target=\"_blank\" rel=\"noopener noreferrer\">changelog</a> for the full list of changes.</p>"
COM_CPANEL_MSG_UTD_3_12_TITLE="What's New in Joomla 3.x UTD 3.12"
COM_CPANEL_MSG_UTD_3_13_BODY="<p>Released on May 31st, 2026.</p><ul><li>The Isis administrator template uses CSS view transitions between pages, and its obsolete CSS was removed.</li><li>Database changes of an update now run automatically, which fixes &quot;Database update version does not match CMS version&quot; in Extensions: Manage: Database.</li><li>Joomla Update's last screen shows the new version (it showed the old one on servers with PHP-FPM and OPcache).</li><li>More PHP 8.1 and 8.2 deprecation fixes, reported by the community.</li></ul><p>See the <a href=\"https://github.com/joomlaworks/joomla-3.x/blob/main/CHANGELOG.md\" target=\"_blank\" rel=\"noopener noreferrer\">changelog</a> for the full list of changes.</p>"
COM_CPANEL_MSG_UTD_3_13_TITLE="What's New in Joomla 3.x UTD 3.13"
COM_CPANEL_MSG_UTD_3_14_BODY="<p>Released on July 4th, 2026.</p><ul><li>Two PHP 8.5 deprecation fixes, contributed by the community.</li><li>The language files report the running version, so vulnerability scanners reading them no longer mistake the site for Joomla 3.10.20.</li></ul><p>See the <a href=\"https://github.com/joomlaworks/joomla-3.x/blob/main/CHANGELOG.md\" target=\"_blank\" rel=\"noopener noreferrer\">changelog</a> for the full list of changes.</p>"
COM_CPANEL_MSG_UTD_3_14_TITLE="What's New in Joomla 3.x UTD 3.14"
COM_CPANEL_MSG_UTD_3_15_BODY="<p>Released on July 18th, 2026.</p><ul><li>13 security fixes backported from official Joomla advisories, each confirmed against Joomla 3 (several were listed as affecting Joomla 4.0 and later only). Among them: a local file inclusion through the layout parameter, an SQL injection in the tags list, and cross-site scripting in language overrides, the template editor, feed modules, content history and Multilingual Associations.</li><li>Password and username reminder links use HTTPS on sites which force HTTPS.</li><li>Module caching: &quot;Use Global&quot; follows the Cache Time of Global Configuration (it was almost always 15 minutes), and the 26 cacheable core modules have a new &quot;Use custom cache time&quot; option.</li><li><a href=\"index.php?option=com_installer&amp;view=manage\">Extensions: Manage</a> can sort by author, to tell third-party extensions from core ones.</li><li>Sites on PHP 7.1 to 7.3 keep receiving updates; PHP 7.4 or newer is recommended.</li><li>Fixed leftover Beez3 and Hathor entries, &quot;_QQ_&quot; shown instead of quotes in messages, and false &quot;Refresh Manifest Cache failed&quot; warnings after updates.</li></ul><p>See the <a href=\"https://github.com/joomlaworks/joomla-3.x/blob/main/CHANGELOG.md\" target=\"_blank\" rel=\"noopener noreferrer\">changelog</a> for the full list of changes.</p>"
COM_CPANEL_MSG_UTD_3_15_TITLE="What's New in Joomla 3.x UTD 3.15"
COM_CPANEL_MSG_UTD_3_16_BODY="<p>Released on October 3rd, 2026.</p><ul><li>14 security fixes backported from Joomla 6.1.3/5.4.8 and 6.1.4/5.4.9, each confirmed against Joomla 3: among them, creating accounts through the profile form with registration disabled, deleting folders through the file cache, ways around the HTML filter, tagged items of restricted categories being listed, and server-side request forgery through URL fields.</li><li><strong>Little WAF</strong>: an optional plugin which blocks known attacks on vulnerable third-party extensions. Enable it in <a href=\"index.php?option=com_plugins&amp;view=plugins&amp;filter_search=Little%20WAF\">Extensions: Plugins</a>.</li><li>Joomla Update keeps the core extensions you uninstalled uninstalled, and can bring them back with &quot;Restore uninstalled core extensions&quot;.</li><li>Joomla Update checks the database type and version before offering an update. The minimums are MySQL 5.5.3, MariaDB 5.5 and PostgreSQL 9.0.</li><li>Removed the cache and session handlers which can't work on PHP 7.1 or newer (APC, Memcache, XCache, Cache_Lite) and the old &quot;mysql&quot; database driver (sites using it switch to MySQLi). Memcached is no longer experimental.</li><li>Many bug fixes and PHP 8.1 to 8.5 deprecation fixes, several of them in stock Joomla 3.</li></ul><p>See the <a href=\"https://github.com/joomlaworks/joomla-3.x/blob/main/CHANGELOG.md\" target=\"_blank\" rel=\"noopener noreferrer\">changelog</a> for the full list of changes.</p>"
COM_CPANEL_MSG_UTD_3_16_TITLE="What's New in Joomla 3.x UTD 3.16"
COM_CPANEL_MSG_UTD_3_17_BODY="<p>Released on October 10th, 2026.</p><p>Joomla 3.x UTD 3.17 brings new templates, a new editor, a command line interface, new database options and many security and compatibility fixes.</p><h4>New in this release</h4><ul><li><strong>Hammond</strong> (news and magazine), <strong>Finch</strong> (blog) and <strong>Rookwood</strong> (studios and companies, dark or light): three new templates built with plain CSS and JavaScript. New sites use them by default; existing sites can switch in <a href=\"index.php?option=com_templates&amp;view=styles&amp;client_id=0\">Templates: Styles</a>.</li><li><strong>News</strong>, <strong>Blog</strong> and <strong>Studio</strong> sample data, which you can add from the Sample Data module of the Control Panel.</li><li><strong>TinyMCE 8</strong>, as &quot;Editor - TinyMCE&quot;. TinyMCE 4 stays as &quot;Editor - TinyMCE (legacy)&quot;: choose the new one as the Default Editor in <a href=\"index.php?option=com_config\">Global Configuration</a>.</li><li><strong>Housekeeping</strong> in the status bar: Clean Cache for everyone with backend access, and Clean Everything and Global Check-in for administrators.</li><li><strong>Install from Web</strong> is included again, as the first tab of <a href=\"index.php?option=com_installer&amp;view=install\">Extensions: Install</a>.</li><li>A <strong>command line interface</strong> (<code>php cli/joomla.php</code>) with the commands of Joomla 4+ and more for content, extensions, templates, the database and site health, with JSON output for scripts.</li><li><strong>AI assistants</strong> can work with your site through the built-in MCP server (<code>php cli/joomla.php mcp:serve</code>), read-only unless you allow changes.</li><li><strong>SQLite</strong> (experimental) as a new database type, and <code>database:convert</code> to move a site between MySQL/MariaDB, PostgreSQL and SQLite.</li></ul><h4>Security and compatibility</h4><ul><li>Security fixes in the installer, the extension installer and Joomla Update, the database drivers and the configuration writer, most of them also present in stock Joomla 3.</li><li>Runs on PHP 7.1 to 8.5, and on MySQL 8.0, 8.4 and 9.x with their default settings. PostgreSQL is fully supported, and SQL Server is now tested.</li><li>Little WAF also checks form data and encoded spellings of the tags it blocks.</li></ul><p>See the <a href=\"https://github.com/joomlaworks/joomla-3.x/blob/main/CHANGELOG.md\" target=\"_blank\" rel=\"noopener noreferrer\">changelog</a> for the full list of changes.</p>"
COM_CPANEL_MSG_UTD_3_17_TITLE="What's New in Joomla 3.x UTD 3.17"
