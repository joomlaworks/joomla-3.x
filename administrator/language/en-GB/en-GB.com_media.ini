COM_MEDIA_FIELD_CHECK_MIME_DESC="Use MIME Magic or Fileinfo to try to verify files. Try disabling this if you get invalid mime type errors."
COM_MEDIA_FIELD_CHECK_MIME_LABEL="Check MIME Types"
COM_MEDIA_FIELD_IGNORED_EXTENSIONS_DESC="File extensions which skip the MIME type and image checks, separated by commas."
COM_MEDIA_FIELD_IGNORED_EXTENSIONS_LABEL="Ignored Extensions"
COM_MEDIA_FIELD_ILLEGAL_MIME_TYPES_DESC="MIME types which are never allowed, separated by commas (blacklist)."
COM_MEDIA_FIELD_ILLEGAL_MIME_TYPES_LABEL="Illegal MIME Types"
COM_MEDIA_FIELD_LEGAL_EXTENSIONS_DESC="Extensions (file types) you are allowed to upload, separated by commas (case doesn't matter; line breaks are allowed). SVG isn't in the default list: an SVG file can contain scripts, which run when the file is opened."
COM_MEDIA_FIELD_LEGAL_EXTENSIONS_LABEL="Legal Extensions (File Types)"
COM_MEDIA_FIELD_LEGAL_IMAGE_EXTENSIONS_DESC="Image extensions (file types) you are allowed to upload, separated by commas. These are used to check for valid image headers."
COM_MEDIA_FIELD_LEGAL_IMAGE_EXTENSIONS_LABEL="Legal Image Extensions (File Types)"
COM_MEDIA_FIELD_LEGAL_MIME_TYPES_DESC="MIME types you are allowed to upload, separated by commas. A file's type is detected from its content, so a type the server's PHP can't detect (e.g. AVIF before PHP 8.1) can't be uploaded."
COM_MEDIA_FIELD_LEGAL_MIME_TYPES_LABEL="Legal MIME Types"
COM_MEDIA_FIELD_MAXIMUM_SIZE_DESC="The maximum size for an upload (in megabytes). Use zero for no limit. The server's own limits still apply: PHP's upload_max_filesize and post_max_size, which only its configuration (php.ini, or the hosting panel) can raise."
COM_MEDIA_FIELD_MAXIMUM_SIZE_LABEL="Maximum Size (in MB)"
COM_MEDIA_FIELD_MEMORY_LIMIT_DESC="PHP's memory limit for uploads and image resizing (in megabytes), when it's lower: large photos need memory to be resized (about 10 bytes a pixel, so 240 MB for a 24 megapixel photo). Empty: the server's limit. Some servers don't allow raising it; images too large for the memory available are then uploaded as they are."
COM_MEDIA_FIELD_MEMORY_LIMIT_LABEL="Memory Limit (in MB)"
COM_MEDIA_FIELD_OPTIMISE_EDITORS_DESC="Optimise images dropped, pasted or uploaded in the editors (TinyMCE, EasyMDE): turned upright (phone photos are often stored sideways), saved without their metadata (photos from phones carry where they were taken) and as WebP if chosen. Their size only changes if you choose so under Resizing. GIFs, which are often animated, are left as they are."
COM_MEDIA_FIELD_OPTIMISE_EDITORS_LABEL="Optimise in Editors"
COM_MEDIA_FIELD_OPTIMISE_MEDIAMANAGER_DESC="The same for images uploaded with the Media Manager's own upload form. Off by default: what you upload there is kept as it is."
COM_MEDIA_FIELD_OPTIMISE_MEDIAMANAGER_LABEL="Optimise in the Media Manager"
COM_MEDIA_FIELD_OPTIMISE_MOBILE_DESC="Save a narrower copy next to every image wider than the Small Screen Width, with the width added to its name (photo.webp gets photo-600.webp). The editors then give the image a srcset, so phones load the copy with any template. Off by default."
COM_MEDIA_FIELD_OPTIMISE_MOBILE_LABEL="Small Screen Copies"
COM_MEDIA_FIELD_OPTIMISE_MOBILE_WIDTH_DESC="The width of the copies for small screens."
COM_MEDIA_FIELD_OPTIMISE_MOBILE_WIDTH_LABEL="Small Screen Width (pixels)"
COM_MEDIA_FIELD_OPTIMISE_QUALITY_DESC="The quality of JPEG, WebP and AVIF images, from 1 to 100. Higher keeps more detail and makes larger files."
COM_MEDIA_FIELD_OPTIMISE_QUALITY_LABEL="Quality"
COM_MEDIA_FIELD_OPTIMISE_RESIZE_DESC="Make images wider than the Maximum Width that wide, keeping their proportions. Off by default: images keep their size."
COM_MEDIA_FIELD_OPTIMISE_RESIZE_LABEL="Limit the Width"
COM_MEDIA_FIELD_OPTIMISE_WEBP_DESC="Save JPEG, PNG, BMP and AVIF images as WebP, which is smaller and shown by every current browser (transparency is kept). No: images keep their format."
COM_MEDIA_FIELD_OPTIMISE_WEBP_LABEL="Save as WebP"
COM_MEDIA_FIELD_OPTIMISE_WIDTH_DESC="Wider images are made this wide, keeping their proportions; narrower ones aren't enlarged."
COM_MEDIA_FIELD_OPTIMISE_WIDTH_LABEL="Maximum Width (pixels)"
COM_MEDIA_FIELD_PATH_FILE_FOLDER_DESC="Enter the path to the files folder relative to the root of your webspace. Warning! Changing to another path than the default 'images' may break your links. Note: Do not start the path with a slash!"
COM_MEDIA_FIELD_PATH_FILE_FOLDER_LABEL="Path to Files Folder"
COM_MEDIA_FIELD_PATH_IMAGE_FOLDER_DESC="Enter the path to the images folder relative to the root of your webspace. This path <strong>has to be the same as path to files (default) or to a subfolder of the path to file folder.</strong>. Note: Do not start the path with a slash!"
COM_MEDIA_FIELD_PATH_IMAGE_FOLDER_LABEL="Path to Images Folder"
COM_MEDIA_FIELD_RESTRICT_UPLOADS_DESC="Restrict uploads for lower than manager users to images if Fileinfo or MIME Magic isn't installed."
COM_MEDIA_FIELD_RESTRICT_UPLOADS_LABEL="Restrict Uploads"
