MOD_CUSTOMBLOCKS="Custom Blocks"
MOD_CUSTOMBLOCKS_XML_DESCRIPTION="Builds a module position's content from blocks (paragraphs, headings, lists, images, videos and posts, quotes, tables, code, notes and HTML) in the Blocks editor. The blocks are written with the site template's layouts when the module is saved, so templates control how each block looks (overrides in html/layouts/joomla/blocks/). Needs \"Editor - Blocks (Editor.js)\"; without it, the module's HTML is shown in a plain text area."
