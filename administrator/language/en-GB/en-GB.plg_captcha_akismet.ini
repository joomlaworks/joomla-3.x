PLG_CAPTCHA_AKISMET="CAPTCHA - Akismet"
PLG_CAPTCHA_AKISMET_API_KEY_DESC="Your Akismet API key, from akismet.com. Keep it secret. A Joomla form uses one CAPTCHA plugin, so on the forms where Akismet is chosen it takes the place of a challenge."
PLG_CAPTCHA_AKISMET_API_KEY_LABEL="API Key"
PLG_CAPTCHA_AKISMET_BLOCK_ALL="All spam"
PLG_CAPTCHA_AKISMET_BLOCK_BLATANT="Blatant spam only"
PLG_CAPTCHA_AKISMET_BLOCK_DESC="All Spam refuses whatever Akismet calls spam. Blatant Spam Only refuses only what Akismet is sure about and lets the rest through, for sites where a missed message costs more than a spam one."
PLG_CAPTCHA_AKISMET_BLOCK_LABEL="Refuse"
PLG_CAPTCHA_AKISMET_ERROR_SPAM="Your message was identified as spam and was not sent. If this is a mistake, please contact us another way."
PLG_CAPTCHA_AKISMET_ERROR_UNAVAILABLE="Your message could not be checked for spam right now, so it was not sent. Please try again later."
PLG_CAPTCHA_AKISMET_PRIVACY_CAPABILITY="The Akismet plugin sends what visitors submit in forms (name, email address, subject, message), with their IP address, browser user agent and the referring page, to Automattic's Akismet service, which decides whether it is spam."
PLG_CAPTCHA_AKISMET_TEST_DESC="Tells Akismet these are tests, so they don't train it. To see a refusal, send a form with the name \"akismet-guaranteed-spam\". Turn it off when you're done."
PLG_CAPTCHA_AKISMET_TEST_LABEL="Test Mode"
PLG_CAPTCHA_AKISMET_UNANSWERED_ALLOW="Let the form through"
PLG_CAPTCHA_AKISMET_UNANSWERED_DESC="What happens when Akismet can't judge a form (no or invalid API key, Akismet unreachable): let the form through (the default, so an outage doesn't stop every visitor) or refuse it. Either way the reason is written to the akismet.php log file."
PLG_CAPTCHA_AKISMET_UNANSWERED_LABEL="When Akismet Can't Answer"
PLG_CAPTCHA_AKISMET_UNANSWERED_REFUSE="Refuse the form"
PLG_CAPTCHA_AKISMET_XML_DESCRIPTION="<img src=\"../plugins/captcha/akismet/images/akismet.svg\" alt=\"Akismet\" width=\"182\" height=\"32\" style=\"float:left;margin:2px 16px 8px 0;padding:8px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px rgba(128,128,128,0.25);\" />Checks what forms send with Akismet, Automattic's anti-spam service, and refuses spam. Visitors see no challenge: Akismet judges the name, email address, subject and message of contact, registration, article and \"email this\" forms. Get an API key at <a href=\"https://akismet.com/\" target=\"_blank\" rel=\"noopener noreferrer\">akismet.com</a> (free for personal sites, paid for commercial ones), then choose \"CAPTCHA - Akismet\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles."
