PLG_CAPTCHA_AKISMET="CAPTCHA - Akismet"
PLG_CAPTCHA_AKISMET_XML_DESCRIPTION="<img src=\"../plugins/captcha/akismet/images/akismet.svg\" alt=\"Akismet\" width=\"182\" height=\"32\" style=\"float:left;margin:2px 16px 8px 0;padding:8px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px rgba(128,128,128,0.25);\" />Checks what forms send with Akismet, Automattic's anti-spam service, and refuses spam. Visitors see no challenge: Akismet judges the name, email address, subject and message of contact, registration, article and \"email this\" forms. Get an API key at <a href=\"https://akismet.com/\" target=\"_blank\" rel=\"noopener noreferrer\">akismet.com</a> (free for personal sites, paid for commercial ones), then choose \"CAPTCHA - Akismet\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles."
