PLG_CAPTCHA_AKISMET="CAPTCHA - Akismet"
PLG_CAPTCHA_AKISMET_XML_DESCRIPTION="Checks what forms send with Akismet, Automattic's anti-spam service, and refuses spam. Visitors see no challenge: Akismet judges the name, email address, subject and message of contact, registration, article and \"email this\" forms. Get an API key at <a href=\"https://akismet.com/\" target=\"_blank\" rel=\"noopener noreferrer\">akismet.com</a> (free for personal sites; commercial sites need a paid plan). Then choose \"CAPTCHA - Akismet\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles. A Joomla form uses one CAPTCHA plugin, so on the forms where Akismet is chosen it takes the place of a challenge."
