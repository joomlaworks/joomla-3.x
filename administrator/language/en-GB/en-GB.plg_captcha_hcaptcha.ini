PLG_CAPTCHA_HCAPTCHA_XML_DESCRIPTION="<img src=\"../plugins/captcha/hcaptcha/images/hcaptcha.svg\" alt=\"hCaptcha\" width=\"146\" height=\"40\" style=\"float:left;margin:2px 16px 8px 0;padding:8px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px rgba(128,128,128,0.25);\" />Protects forms from spam with hCaptcha, a privacy-focused CAPTCHA: a checkbox, sometimes with a picture puzzle, or an invisible check run when the form is sent. Get a site key and a secret key at <a href=\"https://dashboard.hcaptcha.com/\" target=\"_blank\" rel=\"noopener noreferrer\">dashboard.hcaptcha.com</a> (free plan available), then choose \"CAPTCHA - hCaptcha\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles."
