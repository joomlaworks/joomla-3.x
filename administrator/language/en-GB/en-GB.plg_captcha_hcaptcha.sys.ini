PLG_CAPTCHA_HCAPTCHA="CAPTCHA - hCaptcha"
PLG_CAPTCHA_HCAPTCHA_XML_DESCRIPTION="Protects forms from spam with hCaptcha, a privacy-focused CAPTCHA: a checkbox, sometimes with a picture puzzle, or an invisible check run when the form is sent. Get a site key and a secret key at <a href=\"https://dashboard.hcaptcha.com/\" target=\"_blank\" rel=\"noopener noreferrer\">dashboard.hcaptcha.com</a> (free plan available). Then choose \"CAPTCHA - hCaptcha\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles."
