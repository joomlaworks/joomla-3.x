PLG_CAPTCHA_ICONCAPTCHA_ATTEMPTS_DESC="Wrong picks from one IP address within two minutes before it has to wait two minutes for a new challenge. Counted per address, not per visit, so starting a new visit for every guess doesn't help a script; visitors sharing an address (an office, a mobile network) share the count."
