PLG_CAPTCHA_ICONCAPTCHA_XML_DESCRIPTION="<img src=\"../plugins/captcha/iconcaptcha/images/iconcaptcha.svg\" alt=\"IconCaptcha\" width=\"254\" height=\"20\" style=\"float:left;margin:2px 16px 8px 0;padding:8px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px rgba(128,128,128,0.25);\" /><strong>A self-hosted CAPTCHA:</strong> everything runs on your own server, so nothing is sent to another service and no API keys or accounts are needed. Visitors click the icon shown the fewest times. Needs PHP 7.4 or newer with GD. The challenge must be seen and clicked, so visitors using a screen reader or only a keyboard can't complete it. Based on <a href=\"https://github.com/fabianwennink/IconCaptcha-PHP\" target=\"_blank\" rel=\"noopener noreferrer\">IconCaptcha</a> by Fabian Wennink (MIT licence)."
