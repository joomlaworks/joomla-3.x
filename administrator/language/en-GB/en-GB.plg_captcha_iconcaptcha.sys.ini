PLG_CAPTCHA_ICONCAPTCHA="CAPTCHA - IconCaptcha"
PLG_CAPTCHA_ICONCAPTCHA_XML_DESCRIPTION="A self-hosted CAPTCHA: visitors click the icon shown the fewest times. Challenges are made and checked on your own server and kept in the visitor's session, so nothing is sent to another service and no keys are needed. Needs PHP 7.4 or newer and the GD extension. Accessibility: the challenge must be seen and clicked (mouse or touch); visitors using a screen reader or only a keyboard can't complete it, which may matter where accessibility rules apply (e.g. the European Accessibility Act). Based on <a href=\"https://github.com/fabianwennink/IconCaptcha-PHP\" target=\"_blank\" rel=\"noopener noreferrer\">IconCaptcha</a> by Fabian Wennink (MIT licence). Choose \"CAPTCHA - IconCaptcha\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles."
