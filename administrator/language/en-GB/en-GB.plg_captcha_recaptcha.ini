PLG_CAPTCHA_RECAPTCHA="CAPTCHA - Google reCAPTCHA"
PLG_CAPTCHA_RECAPTCHA_XML_DESCRIPTION="<img src=\"../plugins/captcha/recaptcha/images/recaptcha.svg\" alt=\"reCAPTCHA\" width=\"42\" height=\"40\" style=\"float:left;margin:2px 16px 8px 0;padding:8px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px rgba(128,128,128,0.25);\" />Protects forms from spam with Google reCAPTCHA: a checkbox (v2), an invisible check run when the form is sent (v2 invisible), or a score Google gives each submission without any challenge (v3). Get a site key and a secret key of the type you choose at <a href=\"https://www.google.com/recaptcha/admin\" target=\"_blank\" rel=\"noopener noreferrer\">www.google.com/recaptcha/admin</a>, then choose \"CAPTCHA - Google reCAPTCHA\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles."
