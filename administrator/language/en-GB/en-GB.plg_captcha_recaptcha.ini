PLG_RECAPTCHA_TYPE_DESC="The kind of reCAPTCHA, which must match the type of your keys. Checkbox: visitors tick \"I'm not a robot\" (and sometimes solve a picture puzzle). Invisible: the check runs when the form is sent, with a puzzle only when Google is unsure. Score: no challenge at all; Google scores each submission and those below the Minimum Score are refused."
