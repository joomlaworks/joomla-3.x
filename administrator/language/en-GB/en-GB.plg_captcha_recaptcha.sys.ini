PLG_CAPTCHA_RECAPTCHA="CAPTCHA - Google reCAPTCHA"
PLG_CAPTCHA_RECAPTCHA_XML_DESCRIPTION="Protects forms from spam with Google reCAPTCHA: a checkbox (v2), an invisible check run when the form is sent (v2 invisible), or a score Google gives each submission without any challenge (v3). Get a site key and a secret key for your domain, of the type you choose, at <a href=\"https://www.google.com/recaptcha/admin\" target=\"_blank\" rel=\"noopener noreferrer\">www.google.com/recaptcha/admin</a>. Then choose \"CAPTCHA - Google reCAPTCHA\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles."
