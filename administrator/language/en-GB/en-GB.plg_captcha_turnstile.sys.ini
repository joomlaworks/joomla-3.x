PLG_CAPTCHA_TURNSTILE="CAPTCHA - Cloudflare Turnstile"
PLG_CAPTCHA_TURNSTILE_XML_DESCRIPTION="Protects forms from spam with Cloudflare Turnstile, a free CAPTCHA which most visitors pass without doing anything: it checks the browser in the background and only asks for a click when unsure. Create a widget for your domain in the Cloudflare dashboard (Turnstile, <a href=\"https://dash.cloudflare.com/?to=/:account/turnstile\" target=\"_blank\" rel=\"noopener noreferrer\">dash.cloudflare.com</a>; a Cloudflare account is needed, not Cloudflare hosting) and copy its site key and secret key here. Then choose \"CAPTCHA - Cloudflare Turnstile\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles."
