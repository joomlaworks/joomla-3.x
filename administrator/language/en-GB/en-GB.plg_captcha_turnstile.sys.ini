PLG_CAPTCHA_TURNSTILE="CAPTCHA - Cloudflare Turnstile"
PLG_CAPTCHA_TURNSTILE_XML_DESCRIPTION="<img src=\"../plugins/captcha/turnstile/images/turnstile.svg\" alt=\"Cloudflare Turnstile\" width=\"40\" height=\"40\" style=\"float:left;margin:2px 16px 8px 0;padding:8px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px rgba(128,128,128,0.25);\" />Protects forms from spam with Cloudflare Turnstile, a free CAPTCHA most visitors pass without doing anything: it checks the browser in the background and only asks for a click when unsure. Create a widget in the <a href=\"https://dash.cloudflare.com/?to=/:account/turnstile\" target=\"_blank\" rel=\"noopener noreferrer\">Cloudflare dashboard</a> (a free account; your site needn't use Cloudflare) and copy its keys here, then choose \"CAPTCHA - Cloudflare Turnstile\" as the CAPTCHA in Global Configuration, or in the options of Users, Contacts or Articles."
