PLG_CONTENT_PDF="Content - PDF"
PLG_CONTENT_PDF_XML_DESCRIPTION="Shows PDF files in articles and modules with a viewer: write <code>{pdf images/folder/file.pdf}</code> on a line of its own, or use the editors' PDF button. Visitors page through the file, zoom, view it full screen and download it, on phones too. The viewer is pdf.js, loaded only on pages showing a PDF. A shortcode inside a sentence becomes a link to the file."
