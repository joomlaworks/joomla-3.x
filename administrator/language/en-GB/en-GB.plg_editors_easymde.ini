PLG_EDITORS_EASYMDE_XML_DESCRIPTION="A Markdown editor (<a href=\"https://github.com/Ionaru/easy-markdown-editor\" target=\"_blank\" rel=\"noopener noreferrer\">EasyMDE</a>), with a toolbar, preview and side-by-side view. Content is still saved as HTML, so the site, its modules, feeds and search show it as before: the editor turns it into Markdown when it opens and back into HTML when you save, and keeps whatever Markdown can't express (classes, styles, embedded videos, Read More...) as HTML inside the Markdown. Content you open and save without changing it is saved exactly as it was. Files you drop, paste or choose with the upload button are uploaded to the Media Manager and linked."
