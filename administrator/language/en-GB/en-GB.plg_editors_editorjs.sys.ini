PLG_EDITORS_EDITORJS="Editor - Blocks (Editor.js)"
PLG_EDITORS_EDITORJS_XML_DESCRIPTION="Write content as blocks (<a href=\"https://editorjs.io\" target=\"_blank\" rel=\"noopener noreferrer\">Editor.js</a>): paragraphs, headings, lists, images, videos and posts, quotes, tables, code, notes and HTML, each added, moved and changed on its own. Content is still saved as HTML, so the site, its modules, feeds and search show it as before: the blocks are turned into HTML with the site template's layouts when you save (templates may override any block in html/layouts/joomla/blocks/), and the editor keeps the blocks with it, so it opens them as blocks again. Content you open and save without changing it is saved exactly as it was; content written with another editor is turned into blocks when it opens."
