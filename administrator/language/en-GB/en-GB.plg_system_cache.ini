PLG_CACHE_FIELD_BROWSERCACHE_DESC="Browsers which ask whether their copy of a page is still current (with its ETag) get a short \"304 Not Modified\" answer instead of the page again, while the stored page is unchanged."
PLG_CACHE_FIELD_BROWSERCACHE_HOME_DESC="How long, in seconds, browsers may show their copy of the home page without asking the site again (Cache-Control: private, max-age). Pages that change often (a news site's home page) want a short time, e.g. 60 (a minute). 0: browsers ask every time, as before. Only pages this plugin caches (for guests) are kept, and only by browsers, not by shared caches (CDNs, proxies), as cached pages carry each visitor's form token. A visitor who logs in may see their earlier guest copy of a page until it expires: keep the times short."
PLG_CACHE_FIELD_BROWSERCACHE_HOME_LABEL="Browser Cache Time: Home Page (seconds)"
PLG_CACHE_FIELD_BROWSERCACHE_LABEL="Use Browser Caching"
PLG_CACHE_FIELD_BROWSERCACHE_PAGES_DESC="How long, in seconds, browsers may show their copy of every other page without asking the site again, e.g. 180 (three minutes). 0: browsers ask every time, as before. As for the home page: browsers only, guests' pages only, keep it short."
PLG_CACHE_FIELD_BROWSERCACHE_PAGES_LABEL="Browser Cache Time: Other Pages (seconds)"
PLG_CACHE_FIELD_EXCLUDE_DESC="Specify which URLs you want to exclude from caching, each on a separate line. Regular expressions are supported, eg. <br /><strong>about\-[a-z]+</strong> - will exclude all URLs that have 'about-', for example 'about-us', 'about-me', 'about-joomla' etc.<br /><strong>/component/users/</strong> - will exclude all URLs that have /component/users/.<br /><strong>com_users</strong> - will exclude all Users component pages."
PLG_CACHE_FIELD_EXCLUDE_LABEL="Exclude URLs"
PLG_CACHE_FIELD_EXCLUDE_MENU_ITEMS_DESC="Select which menu items you want to exclude from caching."
PLG_CACHE_FIELD_EXCLUDE_MENU_ITEMS_LABEL="Exclude Menu Items"
PLG_CACHE_FIELD_LIFETIME_DESC="Page cache lifetime in minutes."
PLG_CACHE_FIELD_LIFETIME_LABEL="Cache Lifetime"
PLG_CACHE_HEADING_BROWSER="Browser Caching"
PLG_CACHE_HEADING_BROWSER_DESC="What browsers may do with the pages this plugin caches. Saving these options empties the page cache, so new times apply at once."
PLG_CACHE_HEADING_EXCLUSIONS="Exclusions"
PLG_CACHE_HEADING_EXCLUSIONS_DESC="Pages never cached."
PLG_CACHE_XML_DESCRIPTION="Provides page caching."
PLG_SYSTEM_CACHE="System - Page Cache"
