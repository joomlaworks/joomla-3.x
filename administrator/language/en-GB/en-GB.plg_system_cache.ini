PLG_CACHE_FIELD_BROWSERCACHE_DESC="Browsers which ask whether their copy of a page is still current (with its ETag) get a short \"304 Not Modified\" answer instead of the page again, while the stored page is unchanged. Browsers still ask on every visit: this only saves sending the page."
PLG_CACHE_FIELD_BROWSERCACHE_HOME_DESC="How long, in seconds, browsers may show their copy of the home page without asking the site again, e.g. 60. 0: they always ask."
PLG_CACHE_FIELD_BROWSERCACHE_HOME_LABEL="Browser Cache Time: Home Page (seconds)"
PLG_CACHE_FIELD_BROWSERCACHE_LABEL="Not Modified Replies (304)"
PLG_CACHE_FIELD_BROWSERCACHE_PAGES_DESC="How long, in seconds, browsers may show their copy of every other page without asking the site again, e.g. 180. 0: they always ask."
PLG_CACHE_FIELD_BROWSERCACHE_PAGES_LABEL="Browser Cache Time: Other Pages (seconds)"
PLG_CACHE_FIELD_BROWSERCACHE_SEND_DESC="Send a cache time (Cache-Control: max-age) with the pages the page cache sends, so browsers show their copy without asking the site again until it ends. No (the default): browsers ask for every page, so they always show the latest one (with a time, e.g. mobile Chrome shows its copy when a tab becomes active again). A visitor who logs in may see their earlier guest copy of a page until its time ends."
PLG_CACHE_FIELD_BROWSERCACHE_SEND_LABEL="Let Browsers Keep Pages"
PLG_CACHE_FIELD_BROWSERCACHE_SIE_DESC="How long after its cache time a cache may still send its copy when the site answers with an error (Cache-Control: stale-if-error), in seconds: 3600 (an hour) by default; raise it to ride out longer outages. 0: not sent."
PLG_CACHE_FIELD_BROWSERCACHE_SIE_LABEL="Stale-If-Error (seconds)"
PLG_CACHE_FIELD_BROWSERCACHE_SWR_DESC="How long after its cache time a cache may still send its copy while it fetches a fresh one in the background (Cache-Control: stale-while-revalidate), in seconds. Empty (the default): as long as the longest cache time sent (the shared one if set, else the browser one), so the home page and the other pages each get their own. 0: not sent."
PLG_CACHE_FIELD_BROWSERCACHE_SWR_LABEL="Stale-While-Revalidate (seconds)"
PLG_CACHE_FIELD_EXCLUDE_DESC="Specify which URLs you want to exclude from caching, each on a separate line. Regular expressions are supported, eg. <br /><strong>about\-[a-z]+</strong> - will exclude all URLs that have 'about-', for example 'about-us', 'about-me', 'about-joomla' etc.<br /><strong>/component/users/</strong> - will exclude all URLs that have /component/users/.<br /><strong>com_users</strong> - will exclude all Users component pages."
PLG_CACHE_FIELD_EXCLUDE_LABEL="Exclude URLs"
PLG_CACHE_FIELD_EXCLUDE_MENU_ITEMS_DESC="Select which menu items you want to exclude from caching."
PLG_CACHE_FIELD_EXCLUDE_MENU_ITEMS_LABEL="Exclude Menu Items"
PLG_CACHE_FIELD_LOGGED_IN_HEADER_DESC="Sends \"X-Logged-In: True\" or \"False\" with every page of the site, so a cache in front of it (Varnish, a CDN) can store guests' pages (and drop the session cookie Joomla sends with them) but never a logged-in user's. On requests it can tell logged-in visitors by Joomla's joomla_user_state cookie, set at login; this header also covers logins that cookie doesn't announce (e.g. Remember Me). Harmless without such a cache."
PLG_CACHE_FIELD_LOGGED_IN_HEADER_LABEL="Logged-in Header (X-Logged-In)"
PLG_CACHE_FIELD_PAGECACHE_HOME_DESC="How long the home page stays fresh in the page cache, in seconds (60 by default; e.g. 30 for a busy news site). 0: Global Configuration's Cache Time."
PLG_CACHE_FIELD_PAGECACHE_HOME_LABEL="Cache Time: Home Page (seconds)"
PLG_CACHE_FIELD_PAGECACHE_PAGES_DESC="How long every other page stays fresh in the page cache, in seconds (180 by default). 0: Global Configuration's Cache Time."
PLG_CACHE_FIELD_PAGECACHE_PAGES_LABEL="Cache Time: Other Pages (seconds)"
PLG_CACHE_FIELD_PAGECACHE_STALE_DESC="How long a page may still be sent after its cache time, in seconds, e.g. 3600. While one visit makes the fresh copy, every other visitor gets the previous one at once instead of waiting for it (or making it too), so a busy page never slows down when its cache time ends; and when making it fails with a server error, the previous copy is sent instead of an error page (the error still goes to PHP's error log; pages which no longer exist still give their 404). Empty or 0: off."
PLG_CACHE_FIELD_PAGECACHE_STALE_LABEL="Serve Stale Pages For (seconds)"
PLG_CACHE_FIELD_SHAREDCACHE_HOME_DESC="How long caches in front of the site (Varnish, CDNs) may keep the home page (Cache-Control: s-maxage), in seconds, apart from browsers: with browsers not keeping pages, they still get max-age=0 and always fetch the latest copy, from that cache. Empty (the default): not sent; those caches then follow the browser time."
PLG_CACHE_FIELD_SHAREDCACHE_HOME_LABEL="Shared Cache Time: Home Page (seconds)"
PLG_CACHE_FIELD_SHAREDCACHE_PAGES_DESC="How long caches in front of the site (Varnish, CDNs) may keep every other page (Cache-Control: s-maxage), in seconds, apart from browsers. Empty (the default): not sent."
PLG_CACHE_FIELD_SHAREDCACHE_PAGES_LABEL="Shared Cache Time: Other Pages (seconds)"
PLG_CACHE_FURTHER_READING="<p>Further reading: <a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP caching</a> and <a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control\" target=\"_blank\" rel=\"noopener noreferrer\">Cache-Control</a> (MDN), <a href=\"https://web.dev/articles/http-cache\" target=\"_blank\" rel=\"noopener noreferrer\">the HTTP cache</a> and <a href=\"https://web.dev/articles/stale-while-revalidate\" target=\"_blank\" rel=\"noopener noreferrer\">serving stale content while revalidating</a> (web.dev).</p>"
PLG_CACHE_HEADING_ADVANCED="Advanced Caching (Varnish, CDNs)"
PLG_CACHE_HEADING_ADVANCED_DESC="For caches in front of the site, shared by its visitors (Varnish, a CDN). They're sent with any cache time: the browser times above, or the shared times here."
PLG_CACHE_HEADING_BROWSER="Browser Caching"
PLG_CACHE_HEADING_BROWSER_DESC="What browsers may do with the pages the page cache sends. Separate from the page cache on the server: a site can keep pages on the server and still have browsers fetch every page anew."
PLG_CACHE_HEADING_EXCLUSIONS="Exclusions"
PLG_CACHE_HEADING_EXCLUSIONS_DESC="Pages never cached."
PLG_CACHE_HEADING_PAGECACHE="Page Cache (on the server)"
PLG_CACHE_HEADING_PAGECACHE_DESC="How long the site keeps each page it has made, to send it again without making it: guests' pages only. Separate from Global Configuration's Cache Time, which also applies to the caches of components and modules. Saving these options empties the page cache."
PLG_CACHE_XML_DESCRIPTION="Stores each page it makes for guests and sends that copy to the next visitors, skipping Joomla's work (database, components, modules): a stored page goes out in milliseconds. Logged-in users always get fresh pages; links with tracking parameters share the stored page (Global Configuration: Ignored Query Parameters). Below: how long pages are kept (shorter for the home page) and stale pages that keep the site fast while fresh ones are made; what browsers and caches in front of the site (Varnish, CDNs) may keep; pages never stored."
PLG_SYSTEM_CACHE="System - Page Cache"
