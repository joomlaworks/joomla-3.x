PLG_CACHE_FIELD_BROWSERCACHE_DESC="Browsers which ask whether their copy of a page is still current (with its ETag) get a short \"304 Not Modified\" answer instead of the page again, while the stored page is unchanged. Browsers still ask on every visit: this only saves sending the page."
PLG_CACHE_FIELD_BROWSERCACHE_HOME_DESC="How long, in seconds, browsers may show their copy of the home page without asking the site again, e.g. 60. 0: they always ask."
PLG_CACHE_FIELD_BROWSERCACHE_HOME_LABEL="Browser Cache Time: Home Page (seconds)"
PLG_CACHE_FIELD_BROWSERCACHE_LABEL="Not Modified Replies (304)"
PLG_CACHE_FIELD_BROWSERCACHE_PAGES_DESC="How long, in seconds, browsers may show their copy of every other page without asking the site again, e.g. 180. 0: they always ask."
PLG_CACHE_FIELD_BROWSERCACHE_PAGES_LABEL="Browser Cache Time: Other Pages (seconds)"
PLG_CACHE_FIELD_BROWSERCACHE_SEND_DESC="Send a cache time (Cache-Control: private, max-age) with the pages the page cache sends, so browsers show their copy without asking the site again until it ends. No (the default): browsers ask for every page, so they always show the latest one (with a time, e.g. mobile Chrome shows its copy when a tab becomes active again). Browsers only, not shared caches (CDNs, proxies), as cached pages carry each visitor's form token. A visitor who logs in may see their earlier guest copy of a page until its time ends."
PLG_CACHE_FIELD_BROWSERCACHE_SEND_LABEL="Let Browsers Keep Pages"
PLG_CACHE_FIELD_EXCLUDE_DESC="Specify which URLs you want to exclude from caching, each on a separate line. Regular expressions are supported, eg. <br /><strong>about\-[a-z]+</strong> - will exclude all URLs that have 'about-', for example 'about-us', 'about-me', 'about-joomla' etc.<br /><strong>/component/users/</strong> - will exclude all URLs that have /component/users/.<br /><strong>com_users</strong> - will exclude all Users component pages."
PLG_CACHE_FIELD_EXCLUDE_LABEL="Exclude URLs"
PLG_CACHE_FIELD_EXCLUDE_MENU_ITEMS_DESC="Select which menu items you want to exclude from caching."
PLG_CACHE_FIELD_EXCLUDE_MENU_ITEMS_LABEL="Exclude Menu Items"
PLG_CACHE_FIELD_PAGECACHE_HOME_DESC="How long the home page stays fresh in the page cache, in seconds, e.g. 30 for a news site's home page. 0: Global Configuration's Cache Time."
PLG_CACHE_FIELD_PAGECACHE_HOME_LABEL="Cache Time: Home Page (seconds)"
PLG_CACHE_FIELD_PAGECACHE_PAGES_DESC="How long every other page stays fresh in the page cache, in seconds, e.g. 300. 0: Global Configuration's Cache Time."
PLG_CACHE_FIELD_PAGECACHE_PAGES_LABEL="Cache Time: Other Pages (seconds)"
PLG_CACHE_FIELD_PAGECACHE_STALE_DESC="How long a page may still be sent after its cache time, in seconds, e.g. 3600. While one visit makes the fresh copy, every other visitor gets the previous one at once instead of waiting for it (or making it too), so a busy page never slows down when its cache time ends; and when making it fails with a server error, the previous copy is sent instead of an error page (the error still goes to PHP's error log; pages which no longer exist still give their 404). 0: never, as before."
PLG_CACHE_FIELD_PAGECACHE_STALE_LABEL="Serve Stale Pages For (seconds)"
PLG_CACHE_HEADING_BROWSER="Browser Caching"
PLG_CACHE_HEADING_BROWSER_DESC="What browsers may do with the pages the page cache sends. Separate from the page cache on the server: a site can keep pages on the server and still have browsers fetch every page anew."
PLG_CACHE_HEADING_EXCLUSIONS="Exclusions"
PLG_CACHE_HEADING_EXCLUSIONS_DESC="Pages never cached."
PLG_CACHE_HEADING_PAGECACHE="Page Cache (on the server)"
PLG_CACHE_HEADING_PAGECACHE_DESC="How long the site keeps each page it has made, to send it again without making it: guests' pages only. Separate from Global Configuration's Cache Time, which also applies to the caches of components and modules. Saving these options empties the page cache."
PLG_CACHE_XML_DESCRIPTION="Provides page caching."
PLG_SYSTEM_CACHE="System - Page Cache"
