PLG_CACHE_XML_DESCRIPTION="Stores each page it makes for guests and sends that copy to the next visitors, skipping Joomla's work (database, components, modules): a stored page goes out in milliseconds. Logged-in users always get fresh pages; links with tracking parameters share the stored page (Global Configuration: Ignored Query Parameters). Below: how long pages are kept (shorter for the home page) and stale pages that keep the site fast while fresh ones are made; what browsers may keep; pages never stored."
PLG_SYSTEM_CACHE="System - Page Cache"
