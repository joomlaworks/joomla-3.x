PLG_SYSTEM_LITTLEWAF="System - Little WAF"
PLG_SYSTEM_LITTLEWAF_FILTER_MODULESANYWHERE_DESC="Blocks any front-end request carrying a Regular Labs Modules Anywhere {module ...} or {modulepos ...} tag in its address or data (query string, form fields and their names, uploaded file names), also when percent-encoded. A precautionary filter targeting the same class of risk Regular Labs patched for this extension (SSRF/XSS/restricted-content exposure, July 2026). Only checks requests while Modules Anywhere is installed and enabled, never filters the administrator application, and doesn't check form data sent by logged-in users who may create content."
PLG_SYSTEM_LITTLEWAF_FILTER_MODULESANYWHERE_LABEL="Filter Modules Anywhere {module}/{modulepos} tags in requests"
PLG_SYSTEM_LITTLEWAF_FILTER_SOURCERER_DESC="Blocks any front-end request carrying a Regular Labs Sourcerer {source}...{/source} tag in its address or data (query string, form fields and their names, uploaded file names), also when percent-encoded. Mitigates active mass-exploitation of unpatched Sourcerer installs (e.g. CVE-2026-74253) that execute raw PHP embedded in this tag. Only checks requests while Sourcerer is installed and enabled, never filters the administrator application, and doesn't check form data sent by logged-in users who may create content, so legitimate content editing using this tag is unaffected."
PLG_SYSTEM_LITTLEWAF_FILTER_SOURCERER_LABEL="Filter Sourcerer {source}...{/source} tags in requests"
PLG_SYSTEM_LITTLEWAF_LOG_BLOCKED_DESC="Logs each blocked request (IP address, matched filter, where in the request it matched, and the address requested) to the littlewaf.php file in the logs folder for later review."
PLG_SYSTEM_LITTLEWAF_LOG_BLOCKED_LABEL="Log blocked requests"
PLG_SYSTEM_LITTLEWAF_XML_DESCRIPTION="A small, opt-in request filter for known attack signatures against abandoned or historically vulnerable third-party extensions. The plugin is disabled by default; once enabled, every protection below is on by default. Each protection only checks requests while the extension it targets is installed and enabled. Not a substitute for updating or removing the vulnerable extension itself."
