PLG_SYSTEM_LITTLEWAF="System - Little WAF"
PLG_SYSTEM_LITTLEWAF_FILTER_MODULESANYWHERE_DESC="Blocks any front-end request whose URL contains a Regular Labs Modules Anywhere {module ...} or {modulepos ...} tag, in its literal or percent-encoded form. A precautionary filter targeting the same class of risk Regular Labs patched for this extension (SSRF/XSS/restricted-content exposure, July 2026). Has no effect if Modules Anywhere is not installed, and never filters the administrator application."
PLG_SYSTEM_LITTLEWAF_FILTER_MODULESANYWHERE_LABEL="Filter Modules Anywhere {module}/{modulepos} tags on URLs"
PLG_SYSTEM_LITTLEWAF_FILTER_SOURCERER_DESC="Blocks any front-end request whose URL contains a Regular Labs Sourcerer {source}...{/source} tag, in its literal or percent-encoded form. Mitigates active mass-exploitation of unpatched Sourcerer installs (e.g. CVE-2026-74253) that execute raw PHP embedded in this tag. Has no effect if Sourcerer is not installed, and never filters the administrator application, so legitimate content editing using this tag is unaffected."
PLG_SYSTEM_LITTLEWAF_FILTER_SOURCERER_LABEL="Filter Sourcerer {source}...{/source} tags on URLs"
PLG_SYSTEM_LITTLEWAF_LOG_BLOCKED_DESC="Logs each blocked request (IP address, matched filter, and the offending URL) to the 'littlewaf' log category for later review."
PLG_SYSTEM_LITTLEWAF_LOG_BLOCKED_LABEL="Log blocked requests"
PLG_SYSTEM_LITTLEWAF_XML_DESCRIPTION="A small, opt-in request filter for known attack signatures against abandoned or historically vulnerable third-party extensions. The plugin is disabled by default; once enabled, every protection below is on by default. Each protection has no effect unless the extension it targets is actually installed. Not a substitute for updating or removing the vulnerable extension itself."
