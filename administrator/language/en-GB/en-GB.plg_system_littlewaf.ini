PLG_SYSTEM_LITTLEWAF="System - Little WAF"
PLG_SYSTEM_LITTLEWAF_FILTER_MODULESANYWHERE_DESC="Blocks any front-end request carrying a Regular Labs Modules Anywhere {module ...} or {modulepos ...} tag in its address or data (query string, form fields and their names, uploaded file names), also when percent-encoded. A precautionary filter targeting the same class of risk Regular Labs patched for this extension (SSRF/XSS/restricted-content exposure, July 2026). Only checks requests while Modules Anywhere is installed and enabled, never filters the administrator application, and doesn't check form data sent by logged-in users who may create content."
PLG_SYSTEM_LITTLEWAF_FILTER_MODULESANYWHERE_LABEL="Filter Modules Anywhere {module}/{modulepos} tags in requests"
PLG_SYSTEM_LITTLEWAF_FILTER_SOURCERER_DESC="Blocks any front-end request carrying a Regular Labs Sourcerer {source}...{/source} tag in its address or data (query string, form fields and their names, uploaded file names), also when percent-encoded. Mitigates active mass-exploitation of unpatched Sourcerer installs (e.g. CVE-2026-74253) that execute raw PHP embedded in this tag. Only checks requests while Sourcerer is installed and enabled, never filters the administrator application, and doesn't check form data sent by logged-in users who may create content, so legitimate content editing using this tag is unaffected."
PLG_SYSTEM_LITTLEWAF_FILTER_SOURCERER_LABEL="Filter Sourcerer {source}...{/source} tags in requests"
PLG_SYSTEM_LITTLEWAF_HEADING_NORMALIZATIONS="URL Normalizations"
PLG_SYSTEM_LITTLEWAF_HEADING_NORMALIZATIONS_DESC="Malformed addresses of front-end pages, which crawlers make up while they crawl large sites, are sent to their clean address with a permanent (301) redirect, so search engines index one address per page and don't crawl the same page over and over. Only page requests (GET and HEAD) are redirected, never forms that are sent."
PLG_SYSTEM_LITTLEWAF_HEADING_PROTECTIONS="Protections"
PLG_SYSTEM_LITTLEWAF_HEADING_PROTECTIONS_DESC="Requests carrying the tags of abandoned or historically vulnerable extensions are blocked (403). Each protection only checks requests while the extension it targets is installed and enabled."
PLG_SYSTEM_LITTLEWAF_LOG_BLOCKED_DESC="Logs each blocked request (IP address, matched filter, where in the request it matched, and the address requested) to the littlewaf.php file in the logs folder for later review."
PLG_SYSTEM_LITTLEWAF_LOG_BLOCKED_LABEL="Log blocked requests"
PLG_SYSTEM_LITTLEWAF_NORMALIZE_DUPLICATES_DESC="Removes every repeat of a query parameter, keeping the first one where it is: \"?start=100&format=feed&start=200\" becomes \"?start=100&format=feed\" (crawlers append parameters such as start, limitstart or format again and again). Empty parameters (\"&&\", \"&=value\") are removed too. Lists, whose names end in \"[]\", may repeat."
PLG_SYSTEM_LITTLEWAF_NORMALIZE_DUPLICATES_LABEL="Remove duplicate query parameters"
PLG_SYSTEM_LITTLEWAF_NORMALIZE_PATH_AMPERSAND_DESC="Removes what follows an ampersand which comes before the query (or where there is none): \"/page&start=20\" becomes \"/page\", and \"/page&x=1?start=20\" becomes \"/page?start=20\"."
PLG_SYSTEM_LITTLEWAF_NORMALIZE_PATH_AMPERSAND_LABEL="Remove text after an ampersand in the path"
PLG_SYSTEM_LITTLEWAF_NORMALIZE_QUESTION_MARKS_DESC="Removes the extra question marks at the start of the query: \"/page??start=20\" becomes \"/page?start=20\"."
PLG_SYSTEM_LITTLEWAF_NORMALIZE_QUESTION_MARKS_LABEL="Remove doubled question marks"
PLG_SYSTEM_LITTLEWAF_NORMALIZE_SEARCH_FEEDS_DESC="Redirects feeds of search results (\"format=feed\" on the pages of Search, Smart Search and other components' searches, e.g. K2's) to the home page: crawlers request a feed for every search they find."
PLG_SYSTEM_LITTLEWAF_NORMALIZE_SEARCH_FEEDS_LABEL="No feeds of search results"
PLG_SYSTEM_LITTLEWAF_XML_DESCRIPTION="A small request filter for known attack signatures against abandoned or historically vulnerable third-party extensions. The plugin and every protection below are on by default. Each protection only checks requests while the extension it targets is installed and enabled. Not a substitute for updating or removing the vulnerable extension itself. It also sends malformed page addresses crawlers make up (repeated query parameters and the like) to their clean address: see URL Normalizations below."
