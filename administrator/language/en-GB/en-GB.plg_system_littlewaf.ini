PLG_SYSTEM_LITTLEWAF="System - Little WAF"
PLG_SYSTEM_LITTLEWAF_BLOCK_EXECUTABLE_UPLOADS_DESC="Blocks front-end uploads whose file name could run on the server: PHP and other script extensions anywhere in the name (\"shell.php\", \"shell.php.jpg\", \"shell.phtml\"; Joomla's own list of forbidden extensions, plus ASP, JSP and SHTML), server configuration files (.htaccess, .user.ini, web.config) and names with a NUL byte. Joomla checks its own uploads like this, but extensions which read uploads themselves don't always, which made unchecked upload forms one of the most exploited flaws of Joomla extensions."
PLG_SYSTEM_LITTLEWAF_BLOCK_EXECUTABLE_UPLOADS_LABEL="Block executable uploads"
PLG_SYSTEM_LITTLEWAF_BLOCK_PROBES_DESC="Answers requests for files no Joomla site serves through Joomla with a plain 404, before Joomla builds its error page for them: WordPress files (wp-login.php, xmlrpc.php, wp-admin, ...), version control folders (.git, .svn), secrets (.env), database tools (phpMyAdmin, Adminer) and backups or dumps (names ending in .sql, .bak, .old, ~, ...). Scans request these by the hundred; with the shipped .htaccess every missing file reaches Joomla, so this saves the server their pages. Files which exist are served by the web server and never reach Joomla. Not logged."
PLG_SYSTEM_LITTLEWAF_BLOCK_PROBES_LABEL="Block probes for other platforms' files"
PLG_SYSTEM_LITTLEWAF_BLOCK_SCANNERS_DESC="Blocks requests whose user agent names a known attack or vulnerability scanning tool (sqlmap, Nikto, Nuclei, WPScan, Acunetix, Nessus, gobuster, ...). Easy to disguise, so it only stops careless scans, but they are most of them. Turn it off while auditing the site with one of these tools."
PLG_SYSTEM_LITTLEWAF_BLOCK_SCANNERS_LABEL="Block attack tools"
PLG_SYSTEM_LITTLEWAF_BLOCK_SERIALIZED_DESC="Blocks requests carrying a PHP-serialized object (\"O:8:\"stdClass\":...\") in their address, form data, cookies or headers, also when percent-encoded: this is how PHP object injection attacks work, e.g. the 2015 attack on Joomla's own sessions through the User-Agent header. Visitors never send these; the editor's text of users who may write content isn't checked. Turn it off if an extension of the site passes serialized objects through forms or cookies."
PLG_SYSTEM_LITTLEWAF_BLOCK_SERIALIZED_LABEL="Block PHP-serialized objects"
PLG_SYSTEM_LITTLEWAF_FILTER_MODULESANYWHERE_DESC="Blocks any front-end request carrying a Regular Labs Modules Anywhere {module ...} or {modulepos ...} tag in its address or data (query string, form fields and their names, uploaded file names), also when percent-encoded. A precautionary filter targeting the same class of risk Regular Labs patched for this extension (SSRF/XSS/restricted-content exposure, July 2026). Only checks requests while Modules Anywhere is installed and enabled, never filters the administrator application, and doesn't check form data sent by logged-in users who may create content."
PLG_SYSTEM_LITTLEWAF_FILTER_MODULESANYWHERE_LABEL="Filter Modules Anywhere {module}/{modulepos} tags in requests"
PLG_SYSTEM_LITTLEWAF_FILTER_SOURCERER_DESC="Blocks any front-end request carrying a Regular Labs Sourcerer {source}...{/source} tag in its address or data (query string, form fields and their names, uploaded file names), also when percent-encoded. Mitigates active mass-exploitation of unpatched Sourcerer installs (e.g. CVE-2026-74253) that execute raw PHP embedded in this tag. Only checks requests while Sourcerer is installed and enabled, never filters the administrator application, and doesn't check form data sent by logged-in users who may create content, so legitimate content editing using this tag is unaffected."
PLG_SYSTEM_LITTLEWAF_FILTER_SOURCERER_LABEL="Filter Sourcerer {source}...{/source} tags in requests"
PLG_SYSTEM_LITTLEWAF_HEADER_FRAME_OPTIONS_DESC="Stops other sites from showing the site's pages in a frame (clickjacking). Off by default: it also stops embeds the site may want, e.g. its pages or forms shown in a frame on another site of the owner, or in some page builders' previews. \"SAMEORIGIN\" still allows frames on the site itself; \"DENY\" allows none."
PLG_SYSTEM_LITTLEWAF_HEADER_FRAME_OPTIONS_LABEL="X-Frame-Options"
PLG_SYSTEM_LITTLEWAF_HEADER_HSTS_DESC="Tells browsers to use only HTTPS for the site for a year (sent only over HTTPS). Off by default: once browsers have it, the site can't go back to HTTP (e.g. an expired certificate locks visitors out) until it expires. With \"includeSubDomains\" every subdomain must have HTTPS too."
PLG_SYSTEM_LITTLEWAF_HEADER_HSTS_LABEL="Strict-Transport-Security (HSTS)"
PLG_SYSTEM_LITTLEWAF_HEADER_NOSNIFF_DESC="Stops browsers from guessing a file's type, so an uploaded file can't be run as a script or a page when its type says otherwise. Safe for every site."
PLG_SYSTEM_LITTLEWAF_HEADER_NOSNIFF_LABEL="X-Content-Type-Options: nosniff"
PLG_SYSTEM_LITTLEWAF_HEADER_PERMISSIONS_POLICY_DESC="Which browser features the pages may use, e.g. \"camera=(), microphone=(), geolocation=()\" to allow none of these. Empty (the default): not sent. Check embeds and maps, which may need a feature."
PLG_SYSTEM_LITTLEWAF_HEADER_PERMISSIONS_POLICY_LABEL="Permissions-Policy"
PLG_SYSTEM_LITTLEWAF_HEADER_REFERRER_POLICY_DESC="What other sites learn of the page a visitor comes from. \"strict-origin-when-cross-origin\" (the default, and what current browsers do without the header) sends other sites only the site's address, not the page's, and nothing from HTTPS to HTTP. Pages which need stricter rules set their own (Users' password reset pages send \"no-referrer\")."
PLG_SYSTEM_LITTLEWAF_HEADER_REFERRER_POLICY_LABEL="Referrer-Policy"
PLG_SYSTEM_LITTLEWAF_HEADER_XSS_PROTECTION_DESC="Old browsers' XSS filter, which current browsers no longer have. \"0\" (the default, as OWASP and MDN advise) turns it off where it still exists: in the browsers which had it, \"1; mode=block\" could be abused to find out about a page or to block parts of it. Only old browsers read this header either way."
PLG_SYSTEM_LITTLEWAF_HEADER_XSS_PROTECTION_LABEL="X-XSS-Protection"
PLG_SYSTEM_LITTLEWAF_HEADING_GENERIC="Generic Protections"
PLG_SYSTEM_LITTLEWAF_HEADING_GENERIC_DESC="Whole classes of attack which never look like a visitor's request are blocked, whatever extensions the site has: probes for other platforms' files, executable uploads, PHP-serialized objects and attack tools."
PLG_SYSTEM_LITTLEWAF_HEADING_HEADERS="Security Headers"
PLG_SYSTEM_LITTLEWAF_HEADING_HEADERS_DESC="Security headers added to every front-end response. Only those which can't change how a site works are sent by default. Choose \"Don't send\" for a header the web server already adds (in its configuration): sent twice, some headers are ignored. A header the page already has (from an extension) is left as it is."
PLG_SYSTEM_LITTLEWAF_HEADING_NORMALIZATIONS="URL Normalizations"
PLG_SYSTEM_LITTLEWAF_HEADING_NORMALIZATIONS_DESC="Malformed addresses of front-end pages, which crawlers make up while they crawl large sites, are sent to their clean address with a permanent (301) redirect, so search engines index one address per page and don't crawl the same page over and over. Only page requests (GET and HEAD) are redirected, never forms that are sent."
PLG_SYSTEM_LITTLEWAF_HEADING_PROTECTIONS="Extension Protections"
PLG_SYSTEM_LITTLEWAF_HEADING_PROTECTIONS_DESC="Requests carrying the tags of abandoned or historically vulnerable extensions are blocked (403). Each protection only checks requests while the extension it targets is installed and enabled."
PLG_SYSTEM_LITTLEWAF_LOG_BLOCKED_DESC="Logs each request the protections above block (IP address, matched protection, where in the request it matched, and the address requested) to the littlewaf.php file in the logs folder for later review. Probes for other platforms' files aren't logged."
PLG_SYSTEM_LITTLEWAF_LOG_BLOCKED_LABEL="Log blocked requests"
PLG_SYSTEM_LITTLEWAF_NORMALIZE_DUPLICATES_DESC="Removes every repeat of a query parameter, keeping the first one where it is: \"?start=100&format=feed&start=200\" becomes \"?start=100&format=feed\" (crawlers append parameters such as start, limitstart or format again and again). Empty parameters (\"&&\", \"&=value\") are removed too. Lists, whose names end in \"[]\", may repeat."
PLG_SYSTEM_LITTLEWAF_NORMALIZE_DUPLICATES_LABEL="Remove duplicate query parameters"
PLG_SYSTEM_LITTLEWAF_NORMALIZE_ENTITIES_DESC="Turns HTML-escaped ampersands in the query back into ampersands: \"?start=20&amp;limit=10\" becomes \"?start=20&limit=10\" (links copied out of a page's HTML, or written into it unescaped twice; PHP would read \"amp;limit\" as the parameter's name)."
PLG_SYSTEM_LITTLEWAF_NORMALIZE_ENTITIES_LABEL="Fix HTML-escaped ampersands"
PLG_SYSTEM_LITTLEWAF_NORMALIZE_PATH_AMPERSAND_DESC="Removes what follows an ampersand which comes before the query (or where there is none): \"/page&start=20\" becomes \"/page\", and \"/page&x=1?start=20\" becomes \"/page?start=20\"."
PLG_SYSTEM_LITTLEWAF_NORMALIZE_PATH_AMPERSAND_LABEL="Remove text after an ampersand in the path"
PLG_SYSTEM_LITTLEWAF_NORMALIZE_QUESTION_MARKS_DESC="Removes the extra question marks at the start of the query and a question mark with no query after it: \"/page??start=20\" becomes \"/page?start=20\", and \"/page?\" becomes \"/page\"."
PLG_SYSTEM_LITTLEWAF_NORMALIZE_QUESTION_MARKS_LABEL="Remove doubled or empty question marks"
PLG_SYSTEM_LITTLEWAF_NORMALIZE_SEARCH_FEEDS_DESC="Redirects feeds of search results (\"format=feed\" on the pages of Search, Smart Search and other components' searches, e.g. K2's) to the home page: crawlers request a feed for every search they find."
PLG_SYSTEM_LITTLEWAF_NORMALIZE_SEARCH_FEEDS_LABEL="No feeds of search results"
PLG_SYSTEM_LITTLEWAF_OPTION_DONT_SEND="Don't send"
PLG_SYSTEM_LITTLEWAF_XML_DESCRIPTION="A small request filter for known attack signatures against abandoned or historically vulnerable third-party extensions. Each extension protection only checks requests while the extension it targets is installed and enabled, and is not a substitute for updating or removing it. Generic protections block whole classes of attack (probes, executable uploads, PHP object injection, attack tools). It also sends malformed page addresses crawlers make up to their clean address, and can add security headers. Everything is on by default except the security headers which could change how a site works."
