PLG_SYSTEM_LITTLEWAF="System - Little WAF"
PLG_SYSTEM_LITTLEWAF_XML_DESCRIPTION="A small request filter for known attack signatures against abandoned or historically vulnerable third-party extensions. Each extension protection only checks requests while the extension it targets is installed and enabled, and is not a substitute for updating or removing it. Generic protections block whole classes of attack (probes, executable uploads, PHP object injection, attack tools). It also sends malformed page addresses crawlers make up to their clean address, and can add security headers. Everything is on by default except the security headers which could change how a site works."
