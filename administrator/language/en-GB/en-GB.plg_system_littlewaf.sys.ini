PLG_SYSTEM_LITTLEWAF="System - Little WAF"
PLG_SYSTEM_LITTLEWAF_XML_DESCRIPTION="A small, opt-in request filter for known attack signatures against abandoned or historically vulnerable third-party extensions. The plugin is disabled by default; once enabled, every protection below is on by default. Each protection has no effect unless the extension it targets is actually installed. Not a substitute for updating or removing the vulnerable extension itself."
