PLG_SYSTEM_STRUCTUREDDATA_XML_DESCRIPTION="Describes the site's pages to search engines and social networks: Google structured data (schema.org JSON-LD), Open Graph tags (Facebook, LinkedIn, WhatsApp and others) and X (Twitter) cards. Articles, categories, tags, the archive and search results get their own; every other page, e.g. a home page showing featured articles, gets the site's: its name, description, image, publisher and profiles. The structured data type of articles is set here, and can be changed for each category and tag. Extensions which set tags of their own (e.g. K2) keep them."
