INSTL_DATABASE_SQLITE_FILE_DESC="Conair chomhad an bhunachair sonraí, iomlán nó coibhneasta le fréamhfhillteán an tsuímh. Níor cheart go mbeadh aon duine in ann é a íoslódáil: is fearr fillteán lasmuigh de fhréamh an ghréasáin. Faigheann fillteán laistigh den suíomh rialacha a bhacann rochtain ghréasáin air, ach déanann roinnt freastalaithe gréasáin (m.sh. nginx) neamhaird díobh, mar sin coinnigh an t-ainm comhaid randamach freisin. Teastaíonn PHP 7.4 nó níos nuaí ó SQLite; oireann sé do shuímh bheaga agus mheánmhéide, mar nach láimhseálann sé ach scríobh amháin ag an am."
