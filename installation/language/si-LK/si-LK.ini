INSTL_DATABASE_SQLITE_EXTENSION="SQLite දත්ත සමුදා ගොනුවේ නම .sqlite, .sqlite3, .db හෝ .db3 වලින් අවසන් විය යුතුය, උදා. database/joomla.sqlite."
INSTL_DATABASE_SQLITE_FILE_DESC="දත්ත සමුදා ගොනුවේ මාර්ගය, නිරපේක්ෂ හෝ අඩවියේ මූල ෆෝල්ඩරයට සාපේක්ෂ. කිසිවෙකුට එය බාගත කළ නොහැකි විය යුතුය: වෙබ් මූලයෙන් පිටත ෆෝල්ඩරයක් හොඳම වේ. අඩවිය තුළ ඇති ෆෝල්ඩරයකට එයට වෙබ් ප්‍රවේශය අවහිර කරන නීති ලැබෙන නමුත් සමහර වෙබ් සේවාදායක (උදා. nginx) ඒවා නොසලකයි, එබැවින් අහඹු ගොනු නාමයද තබා ගන්න. SQLite සඳහා PHP 7.4 හෝ ඊට නව අනුවාදයක් අවශ්‍යයි; එය වරකට එක් ලිවීමක් පමණක් හසුරුවන බැවින් කුඩා සහ මධ්‍යම ප්‍රමාණයේ අඩවි සඳහා සුදුසුය."
