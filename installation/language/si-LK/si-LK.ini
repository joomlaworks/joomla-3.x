INSTL_DATABASE_PREFIX_DESC="වගු පෙර ලකුණ තෝරන්න හෝ අහඹුව ජනිත වුවක් පාවිච්චි කරන්න. අක්ෂරාංක වලින් පමනක් සමන්විත, අක්ෂර තුන හතරක් දිගු සහ යටි ඉරකින් (_) පමණක්ම අවසන් වන්නක් උචිතවේ. තෝරාගත් පෙර ලකුණ වෙනත් වගුවක භාවිත නොවන්නක් බවට වග බලාගන්න."
