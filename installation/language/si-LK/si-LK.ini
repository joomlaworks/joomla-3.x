INSTL_COMPLETE_LANGUAGE_1="ඔබගේම භාෂාවෙන් යුක්ත ජූම්ලා! සහ/හෝ ස්වයංක්‍රීය සරල ජන්මීය බහුභාෂා අඩවි නිර්මාණය"
INSTL_COMPLETE_LANGUAGE_DESC="ස්ථාපනය කිරීමේ ෆොල්ඩරය ඉවත් කිරීමට පෙර ඔබට අතිරෙක භාෂා ස්ථාපනය කිරීමට හැකිය. ඔබට ඔබගේ ජූම්ල! යෙදුම සඳහා අතිරේක භාෂා එකතු කිරීමට අවශ්‍ය නම් පහත බොත්තම ක්ලික් කරන්න."
INSTL_COMPLETE_LANGUAGE_DESC2="සටහන: නව භාෂා බාගතකර ස්ථාපනය කිරීම සඳහා ඔබට අන්තර්ජාල පිවිසුමක් අවශ්‍යවේ. සමහර සේවාදායක වින්‍යාස ජූම්ලා ට භාෂා ස්ථාපනයට අවසර දෙන්නේ නැත. ඔබේ ගැටළුවත් එවැන්නක් නම්, දුක් වන්න එපා. ජූම්ලා පරිපාලක භාවිතයෙන් ඒවා පසුවට ස්ථාපනය කල හැකිවේ."
INSTL_COMPLETE_TITLE="සුබපැතුම්! දැන් ජූම්ලා ස්ථාපනය කරන ලදි."
INSTL_CONFPROBLEM="ඔබගේ වින්‍යාස ගොනුව හෝ ඩිරෙක්ටරිය මත ලිවිය නොහැක හෝ වින්‍යාස ගොනුව නිර්මාණය වීමේ ගැටලුවකි. පහත දැක්වෙන කේත ඔබට අතින් උඩුගත කිරීමට සිදුවනු ඇත. පාඨ ප්‍රදේශය මත ක්ලික් කර එහි සියළු පාඨ එකවර පිටපත් කර නව පාඨ ගොනුවක් පත අලවන්න. අනතුරුව එය 'configuration.php' ලෙස නම් කර ඔබගේ අඩවියේ මූල ෆොල්ඩරයට උඩුගත කරන්න"
INSTL_COOKIES_NOT_ENABLED="ඔබගේ බ්‍රව්සරය තුල කුකීස් සවිබල කර නොමැති බව පෙනේ. මෙම විශේෂාංගය සවිබල නොකර යෙදුම ස්ථාපනය කිරීමට නොහැකිවේ. එසේ නැතහොත් සේවාදායකයේ session.save_path  හි ගැටළු ඇතිවිය හැක. මෙය ඔබගේ ගැටළුව නම්, කරුණාකර ඔබගේ සංග්‍රාහක සේවාදායකයාගේ උපදෙස් ලබාගන්න හෝ තනිව විසඳාගන්න"
