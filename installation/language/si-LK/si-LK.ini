INSTL_DATABASE_ERROR_CREATE="දත්ත සමුදාය නිම කිරීම සිදුකිරීමේදී දෝශයක් සිදුවිය. පරිශීලකයාට දත්ත සමුදාය නිර්මානය කිරීමේ සෑභෙන වරපසාද නොමැති බව පෙනේ. අවශ්‍ය දත්ත සමුදාය ජූම්ලා ස්ථාපනය කිරීමට පෙර වෙනම සාදා ගැනීම අවශ්‍යවේ."
