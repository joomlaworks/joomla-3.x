INSTL_DATABASE_SQLITE_FILE_DESC="ܫܒܝܠܐ ܕܟܢܦܪܐ ܕܐܣܬ݂ ܡܘܕܥܢܘܢܘܬܐ، ܡܫܡܠܝܐ ܐܘ ܠܘܬ ܕܘܒܩܐ ܥܩܪܝܐ ܕܕܦܐ. ܠܐ ܐܢܫ ܠܐ ܙܕܩ ܕܡܨܐ ܠܡܚܬܬܗ: ܛܒ ܡܢ ܟܠ ܕܘܒܩܐ ܠܒܪ ܡܢ ܥܩܪܐ ܕܓܘܢܐ. ܕܘܒܩܐ ܒܓܘ ܕܦܐ ܫܩܠ ܢܡܘܣܐ ܕܟܠܝܢ ܡܥܠܬܐ ܕܓܘܢܐ ܠܗ، ܐܠܐ ܚܕ ܡܢ ܡܫܡܫܢ̈ܐ ܕܓܘܢܐ (ܐܝܟ nginx) ܠܐ ܚܐܪܝܢ ܒܗܘܢ، ܡܛܠ ܗܕܐ ܢܛܘܪ ܐܦ ܫܡܐ ܡܓܢܝܐ ܕܟܢܦܪܐ. SQLite ܣܢܝܩ ܠ PHP 7.4 ܐܘ ܚܕܬܐ ܝܬܝܪ؛ ܦܐܝܐ ܠܕܦ̈ܐ ܙܥܘܪ̈ܐ ܘܡܨܥܝ̈ܐ، ܡܛܠ ܕܥܒܕ ܚܕ ܟܬܒܐ ܒܚܕ ܙܒܢܐ."
