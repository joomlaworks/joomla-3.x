INSTL_COMPLETE_INSTALL_LANGUAGES="கூடுதல் கட்டங்கள்: மொழிகளை நிறுவுக"
INSTL_COMPLETE_LANGUAGE_1="Joomla! தாங்கள் விரும்பும் மொழியில் மற்றும்/அல்லது தன்னியக்க அடிப்படை பன்மொழித் தள உருவாக்கம்"
INSTL_COMPLETE_LANGUAGE_DESC="&quot;%s&quot; என்ற பெயருடைய கோப்பகத்தை நீக்குவதற்கு முன், தாங்கள் கூடுதல் மொழிகளை நிறுவலாம். தங்கள் Joomla செயலிக்கு (Application) கூடுதல் மொழிகளைத் தாங்கள் சேர்க்க விரும்பினால் பின்வரும் பொத்தானைத் தேர்வுசெய்க."
INSTL_COMPLETE_LANGUAGE_DESC2="குறிப்பு: புதிய மொழிகளை பதிவிறக்கம் செய்து நிறுவ, Joomla-வுக்கு இணைய இணைப்பு மிக அவசியம். <br />சில சேவையக உருவாக்கங்கள் (server configurations), மொழிகளை நிறுவ Joomla-வை அனுமதிக்காது. தங்களுக்கு இவ்வாறு இடையூறு ஏற்பட்டால், கவலைப்பட வேண்டாம்; Joomla நிர்வாகியைப் பயன்படுத்தி, பின்னர், தாங்கள் மொழிகளை நிறுவலாம்."
INSTL_COMPLETE_TITLE="வாழ்த்துகள்! Joomla! தற்போது நிறுவப்பட்டுள்ளது."
INSTL_CONFPROBLEM="தங்கள் உருவாக்கக் (configuration) கோப்பு அல்லது கோப்பகம் எழுத முடியாதது அல்லது கோப்பை எழுதுவதில் பிரச்சினை உள்ளது. தாங்கள் கீழ்க்காணும் குறிமுறையைக் கையால் பதிவேற்ற வேண்டும். அனைத்துக் குறிமுறைகளையும் உரைப் பிரதேசத்தில் தேர்வுசெய்க. பிறகு, புதிய உரைக் கோப்பில் தேர்வுசெய்தக் குறிமுறையை ஒட்டுக. இந்த உரைக் கோப்பை &quot;configuration.php&quot; எனப் பெயரிட்டு அதனைத் தங்கள் தளத்தின் வேர்க் கோப்பகத்தில் பதிவேற்றுக."
INSTL_COOKIES_NOT_ENABLED="தங்கள் உலாவியில் (browser) நினைவிகள் (cookies) இயலுமைப்படுத்தியிருப்பதாகத் தெரியவில்லை. இந்த அம்சம் (feature) முடக்கப்பட்டிருந்தால் தாங்கள் செயலியை (application) நிறுவ முடியாது. மாறாக, சேவையகத்தின் <strong>session.save_path</strong>-இல் பிரச்சினை இருக்கலாம். இவ்வாறு இருந்து, தங்களுக்கு சரி பார்க்க மற்றும் பழுது நீக்கத் தெரியாவிட்டால், தயவுசெய்து தாங்கள் புரவலர் சேவை வழங்குபவரிடம் (hosting provider) ஆலோசிக்க."
INSTL_DATABASE="தரவுத்தள உருவாக்கம்"
INSTL_DATABASE_COULD_NOT_CONNECT="தரவுத்தளத்துடன் தொடர்பு கொள்ள முடியவில்லை. இணைப்பான் (Connector) திருப்பிய எண்: %s"
INSTL_DATABASE_COULD_NOT_CREATE_DATABASE="குறிப்பிட்ட தரவுத்தளத்துடன் நிறுவியால் தொடர்பு கொள்ள முடியவில்லை. ஆதலால், தரவுத்தளத்தை உருவாக்க முடியவில்லை. தயவுசெய்து தங்கள் தரவுத்தள அமைப்புகளை சரிபார்க்க. வேண்டுமானால், தரவுத்தளத்தை தாங்களே உருவாக்கலாம்."
INSTL_DATABASE_COULD_NOT_REFRESH_MANIFEST_CACHE="நீட்சி %s-க்கான வெளிப்படுத்தும் பதுக்குநினைவகத்தைப் (manifest cache) புதுப்பிக்க (refresh) முடியவில்லை"
INSTL_DATABASE_ERROR_BACKINGUP="தரவுத்தளத்தை காப்பு நகலெடுக்கும்போது சில பிழைகள் ஏற்பட்டுள்ளன."
INSTL_DATABASE_ERROR_CREATE="%s என்ற தரவுத்தளத்தை உருவாக்க முயலும்போது பிழை ஏற்பட்டுள்ளது.<br />பயனாளருக்குத் தரவுத்தளத்தை உருவாக்கப் போதிய உரிமை இல்லாமல் இருக்கக்கூடும். வேண்டிய தரவுத்தளத்தை Joomla!-வை நிறுவுவதற்கு முன் தனியாக உருவாக்க வேண்டியிருக்கலாம்."
