INSTL_DATABASE_HOST_IS_NOT_LOCALHOST_DELETE_FILE="தாங்கள் இந்த இணையதளத்துக்கான (website) உரிமையாளர் என்பதனை உறுதிசெய்ய தங்கள் Joomla தளத்தில் உள்ள &quot;%2$s&quot; என்ற பெயருடைய கோப்பகத்தில் நாங்கள் உருவாக்கியுள்ள &quot;%1$s&quot; என்ற பெயருடைய கோப்பை தயவுசெய்து நீக்குக."
INSTL_DATABASE_HOST_IS_NOT_LOCALHOST_GENERAL_MESSAGE="தாங்கள் உள்ளக (local) சேவையகத்தில் (server) அல்லாத வேறு ஒரு தரவுத்தளப் புரவலர் கணினியைப் (database host) பயன்படுத்த முயற்சிக்கிறீர்கள். பாதுகாப்புக் காரணங்களுக்காக, பயன்படுத்தப்படும் இணையசேவையின் சேவைக்கணக்கின் (webhosting account) உரிமையைத் (ownership) தாங்கள் உறுதிப்படுத்த வேண்டும். மேலும் விவரங்களுக்கு, <a href=\"%s\">தயவுசெய்து ஆவணத்தைப் படிக்கவும்</a>."
