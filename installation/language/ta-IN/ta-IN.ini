INSTL_LOCKED_DESC="பாதுகாப்பிற்காக, இந்தத் தளத்தை நிறுவிய உலாவியில் மட்டுமே நிறுவி தொடரும். தளத்திற்கோ அதன் நிர்வாகத்திற்கோ தொடருங்கள், &quot;%s&quot; கோப்புறை நீக்கப்படும்."
