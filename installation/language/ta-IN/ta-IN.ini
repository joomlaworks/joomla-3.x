INSTL_DATABASE_SQLITE_EXTENSION="SQLite தரவுத்தளக் கோப்பின் பெயர் .sqlite, .sqlite3, .db அல்லது .db3 என முடிய வேண்டும், எ.கா. database/joomla.sqlite."
INSTL_DATABASE_SQLITE_FILE_DESC="தரவுத்தளக் கோப்பின் பாதை, முழுமையானது அல்லது தளத்தின் மூலக் கோப்புறையைச் சார்ந்தது. யாரும் அதைப் பதிவிறக்க முடியக்கூடாது: இணைய மூலத்திற்கு வெளியே உள்ள கோப்புறையே சிறந்தது. தளத்தின் உள்ளே உள்ள கோப்புறைக்கு அதற்கான இணைய அணுகலைத் தடுக்கும் விதிகள் கிடைக்கும், ஆனால் சில இணையச் சேவையகங்கள் (எ.கா. nginx) அவற்றைப் புறக்கணிக்கின்றன, எனவே சீரற்ற கோப்புப் பெயரையும் வைத்திருங்கள். SQLite-க்கு PHP 7.4 அல்லது புதியது தேவை; ஒரே நேரத்தில் ஒரு எழுதுதலை மட்டுமே கையாள்வதால் சிறிய மற்றும் நடுத்தர தளங்களுக்கு ஏற்றது."
INSTL_DATABASE_SQLITE_FILE_EMPTY="SQLite தரவுத்தளக் கோப்பின் பாதையை உள்ளிடவும்."
INSTL_DATABASE_SQLITE_FILE_LABEL="தரவுத்தளக் கோப்பு"
INSTL_DATABASE_SQLITE_FOLDER_NOT_CREATED="SQLite தரவுத்தளத்திற்கான %s கோப்புறையை உருவாக்க முடியவில்லை."
INSTL_DATABASE_SQLITE_FOLDER_NOT_WRITABLE="%s கோப்புறையில் எழுத முடியாது. SQLite அங்கு தரவுத்தளக் கோப்பையும் அதன் தற்காலிகக் கோப்புகளையும் எழுத வேண்டும்."
INSTL_DATABASE_SQLITE_IN_SITE_ROOT="SQLite தரவுத்தளக் கோப்பு தளத்தின் மூலக் கோப்புறையில் இருக்கக்கூடாது; அங்கு அது பதிவிறக்கப்படுவதை எதுவும் தடுக்க முடியாது. தனிக் கோப்புறையை, எ.கா. database/joomla.sqlite, அல்லது இணைய மூலத்திற்கு வெளியே உள்ள கோப்புறையைப் பயன்படுத்தவும்."
INSTL_DATABASE_SQLITE_SHARED_FOLDER="%s கோப்புறையில் பிற கோப்புகள் உள்ளன. முழுக் கோப்புறைக்கான இணைய அணுகல் தடுக்கப்படுவதால், தளத்தின் உள்ளே SQLite தரவுத்தளத்திற்குத் தனிக் கோப்புறை (எ.கா. database/) தேவை."
INSTL_DATABASE_SQLITE_VERIFY_OWNERSHIP="SQLite-க்கு தரவுத்தளப் பயனரோ கடவுச்சொல்லோ தேவையில்லை; எனவே வேறு யாரும் இந்தத் தளத்தை நிறுவுவதைத் தடுக்க, அதன் கோப்புகளை உங்களால் மாற்ற முடியும் என்பதைக் காட்ட வேண்டும்."
