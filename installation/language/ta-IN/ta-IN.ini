INSTL_LANGUAGES_DESC="Joomla! இடைமுகமானது பல்வேறு மொழிகளில் கிடைக்கிறது. தாங்கள் விரும்பும் மொழிகளை, முதலில், அவற்றின் தெரிவுப்பெட்டிகளில் தேர்வுசெய்க; பின்னர், அவற்றை நிறுவ 'அடுத்த' பொத்தானைத் தேர்வுசெய்க.<br />குறிப்பு: இந்த செயல்பாடானது (பதிவிறக்கம் மற்றும் நிறுவல்) ஒவ்வொரு மொழிக்கும் சுமார் 10 வினாடிகள் எடுத்துக்கொள்ளும். எனவே, நேரம் முடிதலைத் (timeout) தவிர்க்க, தயவுசெய்து 3 மொழிகளுக்கு மிகாமல் தேர்வுசெய்க."
INSTL_LANGUAGES_MESSAGE_PLEASE_WAIT="இந்த செயல்பாடானது ஒவ்வொரு மொழிக்கும் சுமார் 10 வினாடிகள் எடுத்துக்கொள்ளும்.<br />தயவுசெய்து மொழிகள் பதிவிறக்கம் செய்து நிறுவும் வரை காத்திருக்கவும் ..."
INSTL_LANGUAGES_MORE_LANGUAGES="தாங்கள் மேலும் பல மொழிகளை நிறுவ விரும்பினால் 'முந்தைய' பொத்தானை அமுக்குக."
INSTL_LANGUAGES_NO_LANGUAGE_SELECTED="நிறுவதற்கு எந்த மொழியும் தேர்வுசெய்யப்படவில்லை. தங்களுக்கு பிற மொழிகளை நிறுவ வேண்டுமென்றால் 'முந்தைய' பொத்தானை அமுக்குக மற்றும் பட்டியலிலிருந்து விரும்பும் மொழிகளைத் தேர்வுசெய்க."
INSTL_LANGUAGES_WARNING_BACK_BUTTON="கடந்த நிறுவல் கட்டத்திற்கு செல்க"
