INSTL_DATABASE_SQLITE_FILE_DESC="ساندان ھۆججىتىنىڭ يولى، مۇتلەق ياكى تور بېكەتنىڭ يىلتىز مۇندەرىجىسىگە نىسبەتەن. ھېچكىم ئۇنى چۈشۈرەلمەسلىكى كېرەك: تور يىلتىزىنىڭ سىرتىدىكى مۇندەرىجە ئەڭ ياخشى. تور بېكەت ئىچىدىكى مۇندەرىجىگە تور زىيارىتىنى توسىدىغان قائىدىلەر قوشۇلىدۇ، ئەمما بەزى تور مۇلازىمېتىرلىرى (مەسىلەن nginx) ئۇلارغا پەرۋا قىلمايدۇ، شۇڭا ئىختىيارىي ھۆججەت نامىنىمۇ ساقلاپ قېلىڭ. SQLite ئۈچۈن PHP 7.4 ياكى ئۇنىڭدىن يېڭىسى كېرەك؛ ئۇ بىر قېتىمدا پەقەت بىرلا يېزىشنى بىر تەرەپ قىلىدىغان بولغاچقا، كىچىك ۋە ئوتتۇرا تور بېكەتلەرگە ماس كېلىدۇ."
