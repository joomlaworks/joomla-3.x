INSTL_DATABASE_SQLITE_FILE_DESC="Đường dẫn của tệp cơ sở dữ liệu, tuyệt đối hoặc tương đối so với thư mục gốc của trang. Không ai được phép tải tệp này về: tốt nhất là một thư mục nằm ngoài thư mục gốc web. Thư mục bên trong trang sẽ được thêm các quy tắc chặn truy cập web, nhưng một số máy chủ web (ví dụ nginx) bỏ qua chúng, vì vậy hãy giữ cả tên tệp ngẫu nhiên. SQLite cần PHP 7.4 trở lên; nó phù hợp với các trang nhỏ và vừa vì mỗi lần chỉ xử lý một thao tác ghi."
