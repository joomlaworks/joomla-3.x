MOD_CUSTOMCODE_XML_DESCRIPTION="Adds code of your own (HTML, CSS, JavaScript, embeds, tracking or verification snippets) to a module position, written in the code editor and output as it is. Content plugins don't run on it. Scripts and other tags the text filters remove are kept only for users whose Text Filters in Global Configuration are No Filtering (Super Users, by default)."
